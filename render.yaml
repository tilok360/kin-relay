# Kin Relay on Render's free plan: New > Blueprint, pick this repository/folder. Free services sleep after
# about 15 quiet minutes and take up to a minute to wake, so the first move after a break can be slow.
services:
  - type: web
    name: kin-relay
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: "node relay.js"
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
